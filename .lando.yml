name: worldgraph

recipe: lamp
config:
  webroot: wordpress
  php: '8.2'
  composer_version: '2.7.7'
  database: mariadb

services:
  appserver:
    type: php:8.2
    webroot: wordpress
    ssl: true
    xdebug: false
    build_as_root:
      - apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - curl -fsSL https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
      - echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  /tmp/wp-cli.phar" | sha512sum --check --strict
      - install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
    overrides:
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WP_USERNAME: ${WP_USERNAME:-admin}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-admin}
      WORLDGRAPH_COMFY_API_KEY: ${WORLDGRAPH_COMFY_API_KEY:-}
      WORLDGRAPH_AI_API_KEY: ${WORLDGRAPH_AI_API_KEY:-}
      WORLDGRAPH_AI_FALLBACK_API_KEY: ${WORLDGRAPH_AI_FALLBACK_API_KEY:-}
  database:
    type: mariadb:10.6
    portforward: true
    creds:
      user: wordpress
      password: wordpress
      database: wordpress
  cli:
    type: node:20
    overrides:
      environment:
        PLAYWRIGHT_BROWSERS_PATH: /home/node/.cache/ms-playwright
    run_as_root:
      - "apt-get update && apt-get install -y ffmpeg ripgrep"
      - "npm install sass --save-dev"
      - "npm install minify --save-dev"
      - "npm install jsonlint --save-dev"
      - "npm install @playwright/test playwright --save-dev"
      - "npm install @wordpress/e2e-test-utils-playwright --save-dev"
      - "npm install pixelmatch pngjs --save-dev"
      - "npx playwright install --with-deps chromium"
      - "node -p \"'Chromium: ' + require('/app/node_modules/playwright-core/lib/coreBundle').registry.registry.findExecutable('chromium').executablePath()\""
      - "node -p \"'ffmpeg: ' + require('/app/node_modules/playwright-core/lib/coreBundle').registry.registry.findExecutable('ffmpeg').executablePath('linux')\""
  phpmyadmin:
    type: phpmyadmin
    hosts:
      - database
  headless:
    type: node:20
    port: 3000
    build:
      - cd /app/headless && npm install
    command: npm --prefix /app/headless run dev -- --hostname 0.0.0.0 --port 3000
    overrides:
      environment:
        WORDPRESS_URL: https://worldgraph.lndo.site
        WORDPRESS_HOSTNAME: worldgraph.lndo.site
        WORDPRESS_WEBHOOK_SECRET: ${WORDPRESS_WEBHOOK_SECRET:-change-me}
proxy:
  headless:
    - headless.worldgraph.lndo.site:3000
tooling:
  wp:
    service: appserver
    cmd: /usr/local/bin/wp
    dir: /app/wordpress
  phpunit:
    service: appserver
    cmd: ./vendor/bin/phpunit
  wp-cron:
    service: appserver
    cmd: php wp-cron.php
  npm:
    service: cli
    cmd: /usr/local/bin/npm
  node:
    service: cli
    cmd: /usr/local/bin/node
  npx:
    service: cli
    cmd: /usr/local/bin/npx
  sass:
    service: cli
    cmd: /app/node_modules/.bin/sass
  playwright:
    service: cli
    cmd: /usr/local/bin/npx playwright
  ffmpeg:
    service: cli
    cmd: /usr/bin/ffmpeg
  rg:
    service: cli
    cmd: /usr/bin/rg
  jsonlint:
    service: cli
    cmd: /usr/local/bin/npx jsonlint
  headless-install:
    service: headless
    cmd: npm install
    dir: /app/headless
    description: Install dependencies for the optional headless Next.js frontend.
  headless-npm:
    service: headless
    cmd: npm
    dir: /app/headless
    description: Run npm against the headless frontend.
  headless-build:
    service: headless
    cmd: npm run build
    dir: /app/headless
    description: Build the optional headless Next.js frontend for production.
  pma:
    service: phpmyadmin
    cmd: /bin/sh
