# Docker Compose environment for World Graph Studio
#
# Run all commands from this directory:
#   docker compose up -d
#   docker compose exec appserver wp core is-installed
#
# The WordPress site is served at http://localhost
# phpMyAdmin is available at http://localhost:7007
# The optional headless frontend is available at http://localhost:3000

services:
  appserver:
    build:
      context: ./docker/appserver
    container_name: worldgraph-appserver
    working_dir: /var/www/html/worldgraphstudio
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ../wordpress:/var/www/html/worldgraphstudio
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WP_USERNAME: ${WP_USERNAME:-admin}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-admin}
      WORLDGRAPH_COMFY_API_KEY: ${WORLDGRAPH_COMFY_API_KEY:-}
      WORLDGRAPH_AI_API_KEY: ${WORLDGRAPH_AI_API_KEY:-}
      WORLDGRAPH_AI_FALLBACK_API_KEY: ${WORLDGRAPH_AI_FALLBACK_API_KEY:-}
      APACHE_RUN_GROUP: optusers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database

  database:
    image: mariadb:10.6
    container_name: worldgraph-database
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - worldgraph_db_data:/var/lib/mysql
      - ./docker/database-init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: worldgraph-phpmyadmin
    environment:
      PMA_HOST: database
    depends_on:
      - database

  cli:
    image: node:20
    container_name: worldgraph-cli
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /home/node/.cache/ms-playwright
    command: sleep infinity

  headless:
    image: node:20
    container_name: worldgraph-headless
    working_dir: /app/headless
    volumes:
      - ../headless:/app/headless
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WORDPRESS_URL: https://videohead.duckdns.org/worldgraphstudio
      WORDPRESS_HOSTNAME: videohead.duckdns.org
      WORDPRESS_WEBHOOK_SECRET: ${WORDPRESS_WEBHOOK_SECRET:-change-me}
      NEXT_PUBLIC_BASE_PATH: /studio
    extra_hosts:
      - "videohead.duckdns.org:host-gateway"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - appserver

volumes:
  worldgraph_db_data:
